[project]
name = "weather-dashboard"
version = "0.1.0"
description = "A CLI application for retrieving current and forecast weather for a given location"
requires-python = ">=3.13,<3.15"

[project.scripts]
weather-dashboard = "weather_dashboard.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["weather_dashboard"]

[dependency-groups]
dev = [
    "pytest",
]