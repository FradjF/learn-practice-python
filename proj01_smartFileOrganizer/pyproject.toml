[project]
    name = "file-organizer"
    version = "0.1.0"
    description = "A CLI application that organizes files into folders based on their extensions."
    requires-python = ">= 3.13,<3.15"

[project.scripts]
    file-organizer = "organizer.main:main"

[build-system]
    requires = ["setuptools>=70"]
    build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
    include = ["organizer*"]